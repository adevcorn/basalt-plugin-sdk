[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name = "basalt-plugin-sdk"
version = "0.1.2"
edition = "2021"
description = "Safe Rust SDK for Basalt WASM plugins"

[lib]
crate-type = ["rlib"]

[dependencies]
basalt-plugin-sdk-macros = { path = "macros" }
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }

[features]
serde = ["dep:serde", "dep:bincode"]
